# Spark General Properties
spark.master                     spark://spark-master:7077
spark.eventLog.enabled           false

# Apache Iceberg Catalog Settings (Catalog Name: demo)
spark.sql.extensions             org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.demo           org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.demo.type      hive
spark.sql.catalog.demo.uri       thrift://hive-metastore:9083
spark.sql.catalog.demo.warehouse s3a://gold/iceberg/

# MinIO S3A FileSystem Settings
spark.hadoop.fs.s3a.endpoint              http://minio:9000
spark.hadoop.fs.s3a.access.key            admin
spark.hadoop.fs.s3a.secret.key            password123
spark.hadoop.fs.s3a.path.style.access     true
spark.hadoop.fs.s3a.impl                  org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled false

# Default SQL Warehouse Location
spark.sql.warehouse.dir          s3a://gold/spark-warehouse/
