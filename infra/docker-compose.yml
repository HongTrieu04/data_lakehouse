x-airflow-common-env: &airflow-common-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_AIRFLOW_USER:-airflow}:${POSTGRES_AIRFLOW_PASSWORD:-airflow_pass}@postgres-airflow:5432/${POSTGRES_AIRFLOW_DB:-airflow_db}
  AIRFLOW__CORE__FERNET_KEY: '${FERNET_KEY:-46BKxy25a2q8AByuhZNAbCslqHAqqJeu45lZ_MBYko8=}'
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
  AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
  AIRFLOW__API_AUTH__JWT_SECRET: 'airflow_jwt_secret'
  AIRFLOW__API_AUTH__JWT_ISSUER: 'airflow'
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
  PYTHONPATH: /opt/airflow

x-airflow-common: &airflow-common
  build:
    context: ./airflow
  environment:
    <<: *airflow-common-env
  volumes:
    - ../airflow/dags:/opt/airflow/dags
    - ../airflow/plugins:/opt/airflow/plugins
    - ../spark_jobs:/opt/airflow/spark_jobs
    - ../sql:/opt/airflow/sql
    - ../configs:/opt/airflow/configs
  depends_on:
    postgres-airflow:
      condition: service_healthy

services:
  # ==========================================
  # 1. MINIO S3 OBJECT STORAGE
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: lakehouse-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: lakehouse-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    entrypoint: ["/bin/sh", "-c"]
    volumes:
      - ./minio/init-buckets.sh:/init-buckets.sh
    command: ["/init-buckets.sh"]

  # ==========================================
  # 2. POSTGRES BACKEND DATABASES
  # ==========================================
  postgres-airflow:
    image: postgres:16
    container_name: lakehouse-postgres-airflow
    environment:
      POSTGRES_DB: ${POSTGRES_AIRFLOW_DB:-airflow_db}
      POSTGRES_USER: ${POSTGRES_AIRFLOW_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_AIRFLOW_PASSWORD:-airflow_pass}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AIRFLOW_USER:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-hive:
    image: postgres:16
    container_name: lakehouse-postgres-hive
    environment:
      POSTGRES_DB: ${POSTGRES_HIVE_DB:-metastore_db}
      POSTGRES_USER: ${POSTGRES_HIVE_USER:-hive}
      POSTGRES_PASSWORD: ${POSTGRES_HIVE_PASSWORD:-hive_pass}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_HIVE_USER:-hive}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 3. HIVE METASTORE & HIVE SERVER 2
  # ==========================================
  hive-metastore:
    build:
      context: ./hive-metastore
    container_name: lakehouse-hive-metastore
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/hive/bin/schematool -dbType postgres -info 2>/dev/null
        if [ $$? -ne 0 ]; then
          echo "Initializing Hive Metastore schema..."
          /opt/hive/bin/schematool -dbType postgres -initSchema
        else
          echo "Hive Metastore schema already exists, skipping init."
        fi
        exec /opt/hive/bin/hive --service metastore
    ports:
      - "9083:9083"
    depends_on:
      postgres-hive:
        condition: service_healthy
      minio:
        condition: service_healthy

  hive-server2:
    build:
      context: ./hive-server2
    container_name: lakehouse-hive-server2
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec /opt/hive/bin/hive --service hiveserver2
    ports:
      - "10000:10000"
      - "10002:10002"
    depends_on:
      - hive-metastore

  # ==========================================
  # 4. SPARK MASTER & WORKER
  # ==========================================
  spark-master:
    build:
      context: ./spark
    container_name: lakehouse-spark-master
    user: "0:0"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      - SPARK_MODE=master
      - SPARK_USER=spark
      - HADOOP_USER_NAME=spark
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    ports:
      - "7077:7077"
      - "8085:8080"
    volumes:
      - ../spark_jobs:/opt/spark/spark_jobs
      - ../sql:/opt/spark/sql
      - ../configs:/opt/spark/configs

  spark-worker:
    build:
      context: ./spark
    container_name: lakehouse-spark-worker
    user: "0:0"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_MODE=worker
      - SPARK_USER=spark
      - HADOOP_USER_NAME=spark
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    ports:
      - "8086:8081"
    depends_on:
      - spark-master
    volumes:
      - ../spark_jobs:/opt/spark/spark_jobs
      - ../sql:/opt/spark/sql
      - ../configs:/opt/spark/configs

  # ==========================================
  # 5. AIRFLOW ORCHESTRATION (v3.3.0 Architecture)
  # ==========================================
  airflow-init:
    <<: *airflow-common
    container_name: lakehouse-airflow-init
    user: "0:0"
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create \
            --username admin \
            --firstname Data \
            --lastname Engineer \
            --role Admin \
            --email admin@example.com \
            --password admin || true

  airflow-apiserver:
    <<: *airflow-common
    container_name: lakehouse-airflow-apiserver
    command: api-server
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: lakehouse-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: lakehouse-airflow-dag-processor
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    container_name: lakehouse-airflow-triggerer
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
